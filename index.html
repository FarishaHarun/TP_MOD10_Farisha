<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Sapa Menggunakan AJAX dan PHP</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }
        .kotak {
            width: 420px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            text-align: center;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
        }
        button {
            background-color: #0d6efd;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        #respon {
            margin-top: 20px;
            padding: 12px;
            background-color: #f8f9fa;
            color: #333333;
            border: 1px solid #dddddd;
            text-align: left;
        }
        #respon.error {
            background-color: #fdecea;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        #respon.sukses {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
    </style>
</head>
<body>
    <div class="kotak">
        <h2>Form Sapa Menggunakan AJAX dan PHP</h2>

        <div class="form-group">
            <label for="nama">Masukkan Nama Anda:</label>
            <input type="text" id="nama" name="nama" placeholder="Contoh: Alex">
        </div>

        <button type="button" onclick="kirimData()">Kirim</button>

        <h3>Respon Server:</h3>
        <div id="respon">Menunggu input...</div>
    </div>

    <script>
        function kirimData() {
            var namaInput = document.getElementById("nama").value;
            var xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var kotakRespon = document.getElementById("respon");
                    var hasil = this.responseText;

                    kotakRespon.innerHTML = hasil;

                    if (hasil === "Input nama tidak boleh kosong!") {
                        kotakRespon.className = "error";
                    } else {
                        kotakRespon.className = "sukses";
                    }
                }
            };

            xhttp.open("POST", "server.php", true);
            xhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            xhttp.send("nama=" + encodeURIComponent(namaInput));
        }
    </script>
</body>
</html>
